name: Bug report
description: Report a defect or unexpected behavior in FinSight-AI
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.
        **Do not include secrets, credentials or bank-provided data.**

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A clear, concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Ask ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
      description: What should have happened, and what happened instead? Include screenshots if useful.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - Branch / commit SHA:
        - Browser / device:
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - S1 — Wrong financial figure, data exposure or demo-blocking
        - S2 — Major feature broken, no workaround
        - S3 — Feature broken, workaround exists
        - S4 — Minor / cosmetic
    validations:
      required: true
