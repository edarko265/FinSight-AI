name: Release — Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version (e.g. v0.1.0). Must start with 'v'."
        required: true
        type: string
      release_notes:
        description: "Short release notes (optional)."
        required: false
        type: string

permissions:
  contents: write

jobs:
  tag:
    name: Create & Push Tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Validate version format
        shell: bash
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version: expected vMAJOR.MINOR.PATCH (e.g. v0.1.0, v1.2.3-rc.1)"
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fail if tag exists
        shell: bash
        run: |
          if git rev-parse "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi

      - name: Create and push annotated tag
        shell: bash
        run: |
          git tag -a "$VERSION" -m "${RELEASE_NOTES:-Release $VERSION}"
          git push origin "$VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ contains(inputs.version, '-') }}
